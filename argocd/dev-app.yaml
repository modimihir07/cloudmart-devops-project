apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudmart-dev
  namespace: argocd
spec:
  project: cloudmart
  source:
    repoURL: "https://github.com/YOUR_GITHUB_USERNAME/cloudmart-devops-project-gitops"
    targetRevision: main
    path: k8s-manifests/overlays/dev
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cloudmart-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
