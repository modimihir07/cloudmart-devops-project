apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudmart-dev

resources:
  - namespace.yaml
  - frontend.yaml
  - product-catalog.yaml
  - cart-service.yaml
  - order-service.yaml
  - hpa.yaml
  - ingress.yaml
  - network-policies.yaml
  - pdb.yaml

commonLabels:
  managed-by: kustomize
  project: cloudmart-devops-project

images:
  - name: frontend
    newName: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/cloudmart-dev/frontend
    newTag: YOUR_IMAGE_TAG
  - name: product-catalog
    newName: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/cloudmart-dev/product-catalog
    newTag: YOUR_IMAGE_TAG
  - name: cart-service
    newName: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/cloudmart-dev/cart-service
    newTag: YOUR_IMAGE_TAG
  - name: order-service
    newName: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/cloudmart-dev/order-service
    newTag: YOUR_IMAGE_TAG
