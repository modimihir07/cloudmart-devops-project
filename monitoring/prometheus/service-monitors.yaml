apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudmart-product-catalog
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: product-catalog
  namespaceSelector:
    matchNames:
      - cloudmart-dev
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
