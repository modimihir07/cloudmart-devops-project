apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: cloudmart-logs
  namespace: observability
spec:
  version: 8.16.0
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
        xpack.security.enabled: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: 1Gi
                  cpu: 500m
                limits:
                  memory: 2Gi
                  cpu: 1000m
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms512m -Xmx512m"
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: cloudmart-kibana
  namespace: observability
spec:
  version: 8.16.0
  count: 1
  elasticsearchRef:
    name: cloudmart-logs
  config:
    server.publicBaseUrl: "http://kibana.cloudmart-dev.nip.io"
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m
