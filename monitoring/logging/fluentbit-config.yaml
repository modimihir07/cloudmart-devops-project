apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  namespace: observability
  labels:
    app.kubernetes.io/name: fluentbit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name              tail
        Tag               cloudmart.*
        Path              /var/log/containers/*cloudmart*.log
        Parser            docker
        DB                /var/log/flb_cloudmart.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                parser
        Match               cloudmart.*
        Key_Name            log
        Parser              cloudmart-json
        Reserve_Data        On
        Preserve_Key        On

    [FILTER]
        Name                modify
        Match               cloudmart.*
        Add                 source kubernetes

    [OUTPUT]
        Name                es
        Match               cloudmart.*
        Host                cloudmart-logs-es-http.observability.svc.cluster.local
        Port                9200
        Index               cloudmart-logs
        Type                _doc
        Generate_ID         On
        Suppress_Type_Name  On
        tls                 Off
        Retry_Limit         6

  parsers.conf: |
    [PARSER]
        Name        cloudmart-json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Decode_Field_As    json    log
        Reserve_Data       On

    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
